[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpmp-qubo-beam"
version = "5.0.0"
description = "CPMP QUBO-Beam v5.0 research solver with joint route refinement."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "dimod>=0.12",
  "dwave-neal>=0.6",
  "gurobipy>=13.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools]
packages = [
  "greedy",
  "container_reshuffle",
  "container_reshuffle.solvers",
  "container_reshuffle.qubo",
  "container_reshuffle.mip",
  "container_reshuffle.experiments",
]

[tool.setuptools.package-dir]
greedy = "src/greedy"
container_reshuffle = "container_reshuffle"
