[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yard-greedy"
version = "0.1.0"
description = "Greedy and optional QUBO relocation planner for paired yard bays."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "dimod>=0.12",
  "dwave-neal>=0.6",
  "gurobipy>=13.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
greedy-yard = "greedy.run_batch:main"

[tool.setuptools]
packages = [
  "greedy",
  "container_reshuffle",
  "container_reshuffle.solvers",
  "container_reshuffle.qubo",
  "container_reshuffle.mip",
  "container_reshuffle.experiments",
]

[tool.setuptools.package-dir]
greedy = "src/greedy"
container_reshuffle = "container_reshuffle"
